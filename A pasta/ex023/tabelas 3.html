<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Células</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
    table{
        width: 400px; /* Adicione o ponto e vírgula aqui */
        border-collapse: collapse;
    }
    td{
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }
</style>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td >A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td rowspan=" 2">D</td>
            <td colspan="">E</td>
            <td rowspan="3">F</td>
        </tr>
        <tr>
          
            <td>H</td>
           
        </tr>
        <tr>
            <td colspan="2">J</td>
            
        </tr>
    </table>
</body>
</html>
